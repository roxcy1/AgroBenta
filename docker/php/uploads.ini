; Upload limits for seller listing photos (functional documentation §4.5,
; contract D-10 / GAP-06).
;
; The API accepts up to 10 photos per listing, 5 MB each. These PHP limits must
; not be tighter than that, or a request the application would otherwise accept
; is discarded by PHP before Laravel ever sees it -- the client then gets a
; generic "failed to upload" instead of the real per-file rule.
;
; upload_max_filesize is the per-file ceiling. 6M gives 1 MB of headroom above
; the 5 MB application rule, so a 5.1 MB photo still reaches Laravel and is
; rejected with the accurate "must not be greater than 5120 kilobytes" message
; rather than being silently dropped at the SAPI layer.
upload_max_filesize = 6M

; post_max_size is the whole-request ceiling. It must fit the maximum upload the
; API allows: 10 photos x 5 MB = 50 MB, plus multipart boundaries and headers.
; 64M covers that with room for other form fields. Nginx already allows 200M
; (docker/nginx/default.conf), so PHP is the tighter -- and correct -- boundary.
post_max_size = 64M

; Sanity: the API's per-listing ceiling is 10 photos (Listing::PHOTO_LIMIT), so
; PHP must accept at least that many files in one request. The base image
; default is 20; stated explicitly so a base-image change cannot lower it.
max_file_uploads = 20

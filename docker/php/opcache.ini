; Dev-friendly opcache settings.
; validate_timestamps=1 means PHP checks if a file changed on every request,
; so you don't have to restart the container every time you edit code.
; In production you'd flip this to 0 for a real speed boost.

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
; Revalidate file timestamps every 2s instead of on every request. On the
; Windows bind mount (slow 9P I/O) force-revalidating every loaded file per
; request is a major latency cost; 2s still picks up code edits essentially
; immediately in dev.
opcache.revalidate_freq=2

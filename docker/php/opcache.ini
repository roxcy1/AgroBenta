; Dev-friendly opcache settings.
; validate_timestamps=1 means PHP checks if a file changed on every request,
; so you don't have to restart the container every time you edit code.
; In production you'd flip this to 0 for a real speed boost.

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=0

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 200M;

    # Listing photos are served as static files via the `storage:link` symlink,
    # so they never reach Laravel's CORS middleware. Add CORS headers here so
    # browser clients (Flutter Web, Admin Web) can render them from any
    # development origin — localhost or the machine's LAN IP.
    #
    # The origin is reflected back from the request's Origin header rather than
    # hardcoding a developer-specific address. `supports_credentials` is false,
    # so reflecting the origin is safe for public image resources.
    location ~ ^/storage/ {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age 0 always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Access-Control-Max-Age 0;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "php" here is the service name from compose.yaml — Docker's internal
        # DNS resolves it to the php container's IP on the shared network.
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # Simple endpoint nginx's own healthcheck can hit without touching PHP.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}

# NOT used by the default compose.yaml — kept here as a reference for later.
#
# Why it exists: Supervisor lets ONE container run several long-lived
# processes (queue worker, scheduler, Reverb) and auto-restarts any of them
# if they crash. Some teams prefer this over one-container-per-process.
#
# Why it's optional here: the default setup already gives the queue worker
# and Reverb their own dedicated compose services (see compose.yaml). That's
# more in line with standard container practice (one process per container)
# and is much easier to debug — `docker compose logs reverb` shows you
# exactly what that one process is doing, no supervisor log-multiplexing.
#
# If you ever want to consolidate php-fpm + queue:work + reverb:start into a
# single container (e.g. to save a bit of memory on a small VPS later),
# this file is your starting point.

[supervisord]
nodaemon=true
user=root

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true
stopasgroup=true

[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
